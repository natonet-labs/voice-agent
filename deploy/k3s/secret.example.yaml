# Copy to secret.yaml (gitignored), fill in values, then:
#   kubectl apply -f deploy/k3s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: voice-agent-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-..."
  # Must match the provider's API key (ElevenLabs: OPENAI_API_KEY secret)
  VOICE_AGENT_API_KEY: ""
  LLM_MODEL: "claude-sonnet-4-6"
  ELEVENLABS_API_KEY: ""
  # Option B (later):
  # VAPI_API_KEY: ""
  # RETELL_API_KEY: ""
