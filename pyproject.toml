[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "LangGraph voice agent brain, served as an OpenAI-compatible custom-LLM endpoint for ElevenLabs / Vapi / Retell"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain-anthropic>=1.4.6",
    "langchain-core>=0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic-settings>=2.14.2",
    "prometheus-client>=0.20",
    "tzdata>=2024.1",
    # Security floors for transitive dependencies: versions below these have
    # published advisories (pip-audit, 2026-10-09). The endpoint is public, so
    # don't let a resolver or a stale build cache pick an older release.
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "urllib3>=2.8.0",
    "langsmith>=0.8.18",
    "langgraph-sdk>=0.4.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]

[project.scripts]
voice-agent-chat = "voice_agent.chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
